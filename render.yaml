services:
  - type: web
    name: tony-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: TONY_MODEL
        value: gemini-3.6-flash
